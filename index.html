    window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };

<meta charset="utf-8">
<title>THE DUGOUT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{
  color-scheme:dark;
  --bg:#101820;--card:#192630;--surf:#22323D;--line:#2B3D49;
  --acc:#83A88A;--acc2:#A3C2A9;--gold:#D6B66D;
  --tx:#F2F4F3;--tx2:#98A5AE;--tx3:#6E7C86;
  --pos:#70B98B;--warn:#D6AE59;--neg:#D97878;
  --sans:'Inter','IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --kr:'IBM Plex Sans KR','Inter',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px;
  --gl:max(16px,env(safe-area-inset-left));--gr:max(16px,env(safe-area-inset-right));
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:var(--sans);font-size:14px;letter-spacing:-.01em;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.gold{color:var(--gold)}.acc{color:var(--acc)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* ---------- 공통 레이아웃 ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--bg);height:60px;padding:0 var(--gr) 0 var(--gl);display:flex;align-items:center;gap:12px}
.top .logo{width:34px;height:34px;border-radius:10px;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top .tt{display:flex;flex-direction:column;min-width:0;flex:1}
.top .tt b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt span{font-size:12px;color:var(--tx2)}
.top .back{width:40px;height:40px;margin-left:-10px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:10px}
.top .cash{text-align:right;font-size:11px;color:var(--tx2);display:flex;flex-direction:column}
.top .cash b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--tx)}
main.pg{padding:4px var(--gr) 120px var(--gl);display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px}
.card.tight{padding:6px 0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.hd h2,.hd h3{margin:0;font-size:16px;font-weight:600}
.hd h3{font-size:14px}
.hd .s{font-size:12px;color:var(--tx2)}
.sec-t{font-size:12px;color:var(--tx2);margin:6px 2px -4px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.kv{display:flex;flex-direction:column;gap:2px}
.kv span{font-size:12px;color:var(--tx2)}
.kv b{font-family:var(--mono);font-weight:500;font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.big{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surf);font-size:11px;color:var(--tx2);white-space:nowrap}
.chip.acc{background:rgba(131,168,138,.16);color:var(--acc2)}
.chip.gold{background:rgba(214,182,109,.15);color:var(--gold)}
.chip.neg{background:rgba(217,120,120,.15);color:var(--neg)}
.chip.warn{background:rgba(214,174,89,.15);color:var(--warn)}
.dot{width:6px;height:6px;border-radius:3px;flex-shrink:0;background:var(--tx3)}

/* 버튼 */
.btn{height:48px;border-radius:12px;border:0;background:var(--surf);color:var(--tx);font-weight:600;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:#0E1A14}
.btn.gold{background:var(--gold);color:#1B1608}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sm{height:36px;font-size:13px;border-radius:10px;padding:0 12px}
.btn.xs{height:30px;font-size:12px;border-radius:8px;padding:0 10px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:8px}
.btns>*{flex:1}
.link{border:0;background:transparent;color:var(--acc);font-size:13px;padding:6px 0}

/* 목록 */
.li{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:52px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid rgba(255,255,255,.04)}
.li:first-child{border-top:0}
.li .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .num{width:26px;font-family:var(--mono);font-size:12px;color:var(--tx3);text-align:right;flex-shrink:0}
.li .val{font-family:var(--mono);font-size:13px;text-align:right;flex-shrink:0}
.ovr{width:34px;height:28px;border-radius:8px;background:var(--surf);font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ovr.hi{color:var(--gold)}
button.li:active{background:rgba(255,255,255,.03)}

/* 표 */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;font-size:11px;color:var(--tx2);text-align:right;padding:6px 6px;white-space:nowrap}
table.t td{padding:8px 6px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;border-top:1px solid rgba(255,255,255,.04);white-space:nowrap}
table.t th:first-child,table.t td:first-child{padding-left:16px}
table.t th:last-child,table.t td:last-child{padding-right:16px}
table.t td.l,table.t th.l{text-align:left;font-family:var(--sans)}
table.t tr.me td{background:rgba(131,168,138,.08)}
table.t tr.me td.l{color:var(--acc2);font-weight:600}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 게이지 */
.gauge{height:6px;border-radius:3px;background:var(--surf);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--acc);border-radius:3px}
.trust{display:grid;grid-template-columns:62px minmax(0,1fr) 28px 40px;gap:10px;align-items:center;padding:6px 0;font-size:13px}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(16,24,32,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,255,255,.05);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:62px;padding:0 max(4px,env(safe-area-inset-left)) 0 max(4px,env(safe-area-inset-right))}
nav.tabs button{border:0;background:transparent;color:var(--tx3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;position:relative}
nav.tabs button[aria-current="page"]{color:var(--tx)}
nav.tabs button[aria-current="page"] svg{stroke:var(--acc)}
nav.tabs .bdg{position:absolute;top:8px;left:calc(50% + 6px);min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:#1B1608;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* 진행 바(덕아웃 하단) */
.adv{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:9;pointer-events:none}
.adv .in{max-width:480px;margin:0 auto;padding:8px var(--gr) 10px var(--gl);display:flex;gap:8px;pointer-events:auto;background:linear-gradient(to top,var(--bg) 70%,rgba(16,24,32,0))}
.adv .btn{height:46px}
.adv .btn.pri{flex:1.6}
main.pg.has-adv{padding-bottom:180px}

/* ---------- 타이틀 ---------- */
.title{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 var(--gr) 28px var(--gl);position:relative;overflow:hidden}
.title .field{position:absolute;inset:0;pointer-events:none;opacity:.9}
.title .brand{margin-top:auto;position:relative;padding-top:120px}
.title .mark{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:11px;letter-spacing:.24em;font-weight:600;margin-bottom:18px}
.title .mark i{display:block;width:22px;height:1px;background:var(--gold)}
.title h1{margin:0;font-family:'Inter',sans-serif;font-weight:700;font-size:46px;line-height:.98;letter-spacing:-.035em}
.title h1 span{display:block;color:var(--acc)}
.title .kr{margin-top:12px;font-family:var(--kr);font-size:15px;color:var(--tx2);letter-spacing:.32em}
.title .slogan{margin-top:34px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.title .slogan-kr{margin-top:6px;font-family:var(--kr);font-size:14px;color:var(--tx2)}
.title .menu{position:relative;margin-top:40px;display:flex;flex-direction:column;gap:10px}
.title .cont{display:flex;align-items:center;gap:12px;text-align:left;height:auto;padding:14px 16px;justify-content:flex-start}
.title .cont .grow{display:flex;flex-direction:column;gap:2px}
.title .cont small{font-weight:400;font-size:12px;opacity:.75}
.title .foot{position:relative;margin-top:26px;display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);letter-spacing:.06em}

/* 새 커리어 */
.step{font-size:12px;color:var(--tx2);letter-spacing:.06em}
.field-in{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none}
.field-in:focus{border-color:var(--acc)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:var(--card);border-radius:12px;padding:12px 14px;min-height:60px}
.opt[aria-pressed="true"]{border-color:var(--acc);background:#1C2C33}
.opt .grow b{display:block;font-size:14px;font-weight:600}
.opt .grow span{display:block;font-size:12px;color:var(--tx2)}
.opts{display:flex;flex-direction:column;gap:8px}
.check{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"] .check{border-color:var(--acc);background:var(--acc)}

/* 경기 화면 */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.score .tm{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--tx2)}
.score .tm b{font-size:16px;color:var(--tx);font-weight:600}
.score .sc{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:.02em}
.ls{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin-top:12px}
.ls th{color:var(--tx3);font-weight:400;padding:3px 0;text-align:center}
.ls td{text-align:center;padding:4px 0}
.ls td:first-child,.ls th:first-child{text-align:left;font-family:var(--sans);width:40px}
.ls td.r{color:var(--tx);font-weight:500}
.inn-h{position:sticky;top:60px;background:var(--bg);z-index:2;padding:10px 2px 6px;font-size:12px;color:var(--tx2);display:flex;justify-content:space-between}
.pa{display:flex;gap:10px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.04);align-items:flex-start}
.pa .bases{flex-shrink:0;margin-top:3px}
.pa .tx{flex:1;min-width:0}
.pa .tx b{font-weight:500}
.pa .tx .d{font-size:13px;color:var(--tx2)}
.pa .tx .seq{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:3px}
.pa.run .tx .d{color:var(--gold)}
.pa .s{font-family:var(--mono);font-size:12px;color:var(--tx2);flex-shrink:0;text-align:right}
.weg{width:100%;height:120px;display:block}

/* 필드 보드 */
.fieldboard{position:relative;width:100%;aspect-ratio:1/0.82;background:var(--card);border-radius:var(--r);overflow:hidden}
.fieldboard svg{position:absolute;inset:0;width:100%;height:100%}
.fb-p{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:2px}
.fb-p .c{min-width:56px;max-width:84px;height:24px;border-radius:7px;background:var(--surf);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.fb-p .k{font-size:10px;color:var(--tx3)}
.fb-p[aria-pressed="true"] .c{border-color:var(--gold);color:var(--gold)}
.ord .li .ctl{display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:9px;border:0;background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ic:disabled{opacity:.3}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surf);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;height:32px;font-size:13px;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--tx)}
.tabs2{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs2 button{flex-shrink:0;border:0;height:34px;border-radius:17px;padding:0 14px;background:var(--card);color:var(--tx2);font-size:13px}
.tabs2 button[aria-pressed="true"]{background:var(--tx);color:var(--bg);font-weight:600}

/* 결정 화면(전체) */
.sheet{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 var(--gr) 28px var(--gl)}
.sheet .eyebrow{margin-top:28px;font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:600}
.sheet h1{margin:10px 0 6px;font-size:26px;line-height:1.2;letter-spacing:-.03em;font-weight:700}
.sheet .lead{color:var(--tx2);font-size:14px;margin:0 0 18px}
.sheet .foot{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:8px}
.quote{font-family:var(--kr);font-size:17px;line-height:1.55;font-weight:500;padding:18px;border-radius:var(--r);background:var(--card);border-left:3px solid var(--gold)}
.ans{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;width:100%}
.ans[aria-pressed="true"]{border-color:var(--acc);background:#1C2C33}
.ans .fx{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:30;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
#busy{position:fixed;inset:0;z-index:40;background:rgba(16,24,32,.72);display:flex;align-items:center;justify-content:center}
#busy[hidden]{display:none}
.busy-in{background:var(--card);border-radius:var(--r);padding:20px 24px;display:flex;align-items:center;gap:14px;font-size:14px;min-width:220px}
.spin{width:22px;height:22px;border-radius:11px;border:2px solid var(--surf);border-top-color:var(--acc);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.empty{padding:22px 16px;text-align:center;color:var(--tx2);font-size:13px}
.pill-res{width:16px;height:16px;border-radius:4px;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.pill-res.W{background:rgba(112,185,139,.22);color:var(--pos)}.pill-res.L{background:rgba(217,120,120,.18);color:var(--neg)}.pill-res.T{background:var(--surf);color:var(--tx2)}
.bar2{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surf)}
.bar2 i{display:block;height:100%}
.note{font-size:12px;color:var(--tx2);line-height:1.5}
.divider{height:1px;background:rgba(255,255,255,.05);margin:10px 0}
.howto{display:flex;flex-direction:column;gap:14px}
.howto .n{width:26px;height:26px;border-radius:13px;background:var(--surf);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ratings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.rt{display:grid;grid-template-columns:64px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:12px}
.rt b{font-family:var(--mono);font-weight:500;font-size:12px;text-align:right}
.sel{border:1px solid var(--line);background:var(--card);height:40px;border-radius:10px;padding:0 10px;width:100%}
.tradebox{display:flex;flex-direction:column;gap:6px;min-height:40px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border-radius:8px;padding:6px 8px;font-size:12px}
.tag button{border:0;background:transparent;color:var(--tx2);padding:0 2px}

/* ---------- 타이틀(키 비주얼) ---------- */
.title2{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#041826 0,#071B28 55%,var(--bg) 100%)}
.title2 .hero{position:relative;margin:0 calc(-1 * env(safe-area-inset-left)) 0 calc(-1 * env(safe-area-inset-right))}
.title2 .hero img{display:block;width:100%;height:auto;max-height:62vh;object-fit:cover;object-position:50% 40%}
.title2 .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(rgba(4,24,38,0),#041826)}
.t2-body{flex:1;display:flex;flex-direction:column;padding:0 var(--gr) 24px var(--gl);margin-top:-6px;position:relative}
.t2-kr{font-family:var(--kr);font-size:13px;letter-spacing:.42em;color:var(--gold);text-align:center}
.t2-slogan{margin-top:8px;font-family:var(--kr);font-size:15px;color:var(--tx);text-align:center;font-weight:500}
.title2 .menu{margin-top:36px;display:flex;flex-direction:column;gap:10px}
.title2 .cont{display:flex;align-items:center;gap:12px;text-align:left;height:auto;padding:14px 16px;justify-content:flex-start}
.title2 .cont .grow{display:flex;flex-direction:column;gap:2px}
.title2 .cont small{font-weight:400;font-size:12px;opacity:.75}
.title2 .foot{margin-top:auto;padding-top:24px;display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);letter-spacing:.12em}
.simmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

/* ---------- 실시간 경기 ---------- */
.lv{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:220px}
.lv-top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:4px;padding:8px var(--gr) 6px calc(var(--gl) - 6px);border-bottom:1px solid rgba(255,255,255,.05)}

// ---------- 일정: 원형 라운드로빈 × 6사이클, 시리즈 길이 [3,3,3,3,2,2] → 팀당 144경기 ----------

  for (let r = 0; r < n - 1; r++) {
    const pairs = []; for (let i = 0; i < n / 2; i++) pairs.push([ids[i], ids[n - 1 - i]]);
    rounds.push(pairs); ids.splice(1, 0, ids.pop());
  }
  const series = [];
  [3, 3, 3, 3, 2, 2].forEach((len, cyc) => {
    const ord = [...rounds]; for (let i = ord.length - 1; i > 0; i--) { const j = Math.floor(rng.r() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }

// ---------- 날씨 ----------
const MONTH = d => Math.min(9, 3 + Math.floor((d + 22) / 30)); // day0 = 3월 하순
const TEMP = { 3: 10, 4: 15, 5: 20, 6: 24, 7: 27, 8: 28, 9: 23, 10: 16 };
const RAIN = { 3: 0.05, 4: 0.06, 5: 0.07, 6: 0.10, 7: 0.15, 8: 0.10, 9: 0.06, 10: 0.05 };
// 기온(구장별 보정)·바람(외야 방향 성분 wind, 좌우 성분 lat)·습도 → 비거리, 강수 → 취소
function weather(park, day, rng) {

  const m = MONTH(day), windy = park.windy || 1;
  const temp = TEMP[m] + (park.hot || 0) + rng.norm() * 3, wind = rng.norm() * 2.5 * windy, lat = rng.norm() * 2 * windy;

// ---------- 경기 전 준비 ----------

    budgetC: !rows.length ? C.t2 : over > 0 ? C.warn : C.pos,

    reasons: [

      { k: '가치 평가', v: !ev ? '-' : ev.accept ? `받는 쪽이 +${f1(ev.gap)}억 이득이라고 봅니다(수락 기준 +0.5억).` : (ev.reason || '조건이 맞지 않습니다') + (ev.gap != null ? ` (차이 ${f1(ev.gap)}억)` : '') },

    ],

// 거래를 가정한 전력 예측: 우리 로스터에서 보내는 선수 자리에 받는 선수(우리 스카우트 평가)를 넣고 엔진 teamProjection

function projectSwap(G, U, gives, gets) {

  for (const k of vac) { const c = bench.shift(); if (c) plan[k] = c; }

  }

  return X.teamProjection({ order, plan, rotation, pen }, G.world.L);
}

function tabbar() {
  const w = G.world, pend = (w.proposals || []).filter(x => !x.done).length;
  return `<nav class="tabs" aria-label="주 메뉴"><div class="in">${TABS.map(([k, l]) => `<button data-a="tab:${k}" ${st.tab === k ? 'aria-current="page"' : ''}>${I[k]}<span>${l}</span>${k === 'market' && pend ? `<span class="bdg">${pend}</span>` : ''}</button>`).join('')}</div></nav>`;

function toast(msg) { st.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { st.toast = null; render(); }, 2600); }
const busy = (on, txt) => { const b = document.getElementById('busy'); b.hidden = !on; if (txt) document.getElementById('busyTxt').textContent = txt; };
const frame = () => new Promise(r => setTimeout(r, 0));

// ---------- 진행 ----------
async function run(mode) {
  if (st.running) return; st.running = true; track(mode === 'live' ? 'live_start' : 'sim', { mode, ...trackCtx() });
  const U0 = G.U, g0 = U0 && U0.games && G.gen ? U0.games.length : 0, d0 = G.cur && G.cur.t === 'day' ? G.cur.day : -1;
  busy(true, G.gen ? '시뮬레이션 중' : '시즌을 여는 중');
  await frame();
  let n = 0; const rain0 = G.U ? G.U.rain || 0 : 0;
  if (mode === 'live') G.act('live');
  try {
    while (true) {
      const v = G.next(); n++;
      if (!v || v.done) break;
      if (v.t !== 'day') break;
      const U = G.U;
      if (mode === 'live' && U && U.rain > rain0) { st.toastAfter = '우천으로 경기가 취소됐습니다'; break; }
      if (mode === 'game' && U && U.games && U.games.length > g0) break;
      if (mode === 'week' && d0 >= 0 && v.day - d0 >= 7) break;
      if (mode === 'week' && d0 < 0 && n >= 7) break;
      if (mode === 'deadline' && G.world.cal && v.day >= G.world.cal.deadline) break;
      if (n % 2 === 0) { document.getElementById('busyTxt').textContent = `${V.dstr(v.day)} 진행 중`; await frame(); }
    }
  } catch (e) { console.error(e); st.err = String(e && e.stack || e); }
  G.save(); st.running = false; busy(false);
  if (st.toastAfter) { const t = st.toastAfter; st.toastAfter = null; setTimeout(() => toast(t), 0); }
  if (mode === 'game' && G.games.length && G.cur && G.cur.t === 'day') { const lg = G.games[G.games.length - 1]; if (lg.day === G.cur.day) st.lastShown = lg; }
  route();
}
async function answer(v) {
  if (G && G.cur) track('decision', { step: G.cur.t, ...trackCtx() });
  busy(true, '다음 단계로'); await frame();
  try { G.next(v); } catch (e) { console.error(e); st.err = String(e && e.stack || e); }
  G.save(); busy(false); st.dec = {}; st.sel = null;
  if (G.cur && G.cur.t === 'pre' && !G.world.gameOver) { st.scr = 'main'; st.tab = 'home'; toast(`${yr(G.world.year + 1)} 시즌 준비가 끝났습니다`); return; }
  route();
}
function route() {
  if (!G) { st.scr = 'title'; return render(); }
  if (G.world.gameOver) { if (st.scr !== 'end') track('game_over', { seasons: (G.M.history || []).length, reason: G.world.gameOver.reason }); st.scr = 'end'; }
  else if (G.isLive()) { st.scr = 'live'; if (!st.live) st.live = newLive(true); }
  else if (G.isDecision() && G.cur.t !== 'trades') st.scr = 'decision';
  else if (['decision', 'end', 'title', 'new', 'live'].includes(st.scr)) { st.scr = 'main'; st.live = null; }
  render();
}

// ---------- 경기(중계) ----------
function vGame() {
  const rec = st.game, g = V.game(G, rec), f = st.sub.gameFilter || 'key';
  const aName = g.a, hName = g.h;
  const inns = Math.max(9, g.inn);
  const lines = [0, 1].map(half => { const r = []; for (let i = 1; i <= inns; i++) { const pas = g.ev.filter(e => e.inn === i && e.half === half); r.push(pas.length ? pas.reduce((a, e) => a + (e.runs || 0), 0) : (i > g.inn || (half === 1 && i === g.inn && g.hs > g.as && !pas.length) ? '' : 'X')); } return r; });
  const hits = [0, 1].map(half => g.ev.filter(e => e.half === half && e.code >= 3 && e.code <= 6).length);
  const myWin = (g.home ? g.hs > g.as : g.as > g.hs), tie = g.hs === g.as;
  // 승리 확률 그래프
  const pts = [{ x: 0, y: g.home ? 0.54 : 0.46 }, ...g.ev.map((e, i) => ({ x: i + 1, y: e.we }))];
  const Wd = 340, Hh = 110, X = i => 6 + i / Math.max(1, pts.length - 1) * (Wd - 12), Y = v => 6 + (1 - v) * (Hh - 12);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const innTicks = []; let lastInn = 0; g.ev.forEach((e, i) => { if (e.inn !== lastInn) { innTicks.push({ x: X(i), inn: e.inn }); lastInn = e.inn; } });
  const swings = g.ev.map((e, i) => ({ i, d: Math.abs(e.we - (i ? g.ev[i - 1].we : pts[0].y)) })).sort((a, b) => b.d - a.d).slice(0, 3).map(x => x.i);
  const wg = `<svg class="weg" viewBox="0 0 ${Wd} ${Hh}" role="img" aria-label="우리 팀 승리 확률 흐름"><line x1="6" x2="${Wd - 6}" y1="${Y(0.5)}" y2="${Y(0.5)}" stroke="#2B3D49" stroke-dasharray="3 4"/>${innTicks.map(t => `<line x1="${t.x}" x2="${t.x}" y1="6" y2="${Hh - 6}" stroke="#22323D"/><text x="${t.x + 2}" y="${Hh - 2}" font-size="8" fill="#6E7C86" font-family="IBM Plex Mono">${t.inn}</text>`).join('')}<path d="${path}" fill="none" stroke="#83A88A" stroke-width="1.8" stroke-linejoin="round"/>${swings.map(i => `<circle cx="${X(i + 1)}" cy="${Y(g.ev[i].we)}" r="3" fill="#D6B66D"/>`).join('')}</svg>`;
  // 플레이 목록
  const key = new Set(swings); const show = e => f === 'all' || e.runs > 0 || key.has(e.i) || (e.code === 0 && e.outs0 === 2 && e.b0) || e.code === 6;
  let list = '', curK = '';
  for (const e of g.ev) {
    if (!show(e)) continue;
    const k = e.inn + ':' + e.half; if (k !== curK) { curK = k; list += `<div class="inn-h"><span>${e.inn}회${e.half ? '말' : '초'} · ${e.half ? hName : aName} 공격</span><span class="m">${e.score[0]} : ${e.score[1]}</span></div>`; }
    const seq = e.seq.length ? e.seq.slice(-4).map(x => `${x.t}${x.v ? ' ' + x.v : ''}`).join(' · ') + ` (${e.seq.length}구)` : '';
    list += `<div class="pa${e.runs ? ' run' : ''}">${bases(e.b0 || 0)}<div class="tx"><div><b>${esc(e.bat)}</b> <span class="mut" style="font-size:12px">vs ${esc(e.pit)} · ${e.outs0}아웃</span></div><div class="d">${esc(e.desc)}</div>${seq ? `<div class="seq">${esc(seq)}</div>` : ''}</div><div class="s">${key.has(e.i) ? `<span class="chip gold">승부처</span>` : ''}</div></div>`;
  }
  const subs = f === 'all' && g.subs.length ? `<div class="sec-t">교체</div><div class="card note">${g.subs.map(s => `${s.inn}회 · ${esc(s.txt)}`).join('<br>')}</div>` : '';
  return `${topbar(`${aName} @ ${hName}`, `${g.date} · ${g.park}`, { back: 'closegame' })}<main class="pg">
  <section class="card"><div class="score"><div class="tm"><b>${esc(aName)}</b>원정</div><div class="sc">${g.as} : ${g.hs}</div><div class="tm"><b>${esc(hName)}</b>홈</div></div>
  <div style="text-align:center;margin-top:6px"><span class="chip ${tie ? '' : myWin ? 'acc' : 'neg'}">${tie ? '무승부' : myWin ? '승리' : '패배'}${g.inn > 9 ? ` · 연장 ${g.inn}회` : ''}</span></div>
  <div class="scroll-x"><table class="ls"><thead><tr><th></th>${Array.from({ length: inns }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>R</th><th>H</th></tr></thead><tbody>${[0, 1].map(hf => `<tr><td>${esc(hf ? hName : aName)}</td>${lines[hf].map(v => `<td>${v}</td>`).join('')}<td class="r">${hf ? g.hs : g.as}</td><td>${hits[hf]}</td></tr>`).join('')}</tbody></table></div>
  <div class="note" style="margin-top:10px">${g.W ? `승 ${esc(g.W)}` : ''}${g.L ? ` · 패 ${esc(g.L)}` : ''}${g.SV ? ` · 세 ${esc(g.SV)}` : ''} · 기온 ${g.temp}℃</div></section>
  <section class="card"><div class="hd"><h3>승리 확률</h3><span class="s">우리 팀 기준 · 점은 승부처</span></div>${wg}</section>
  <div class="seg" role="group" aria-label="보기"><button data-a="gf:key" aria-pressed="${f === 'key'}">주요 장면</button><button data-a="gf:all" aria-pressed="${f === 'all'}">전체 타석</button></div>
  <div class="card tight" style="padding-top:0">${list || '<div class="empty">표시할 장면이 없습니다</div>'}</div>${subs}</main>`;
}

const FIELD_XY = { C: [50, 92], '1B': [74, 62], '2B': [61, 42], '3B': [26, 62], SS: [39, 42], LF: [17, 25], CF: [50, 12], RF: [83, 25], DH: [86, 93] };
function curPlan() { const L = V.lineup(G); const plan = {}; for (const o of L.order) plan[o.pos] = o.id; return { L, plan, order: L.order.map(o => o.id) }; }
function setLineup(plan, order) { G.act('lineup', { plan, order }); G.save(); }
function vLineup() {
  const L = V.lineup(G), sub = st.sub.lu || 'bat', sel = st.sel;
  let h = `${topbar('라인업', `팀 종합 ${L.ovr.team} · 리그 ${L.ovr.rank}위`)}<main class="pg"><div class="seg" role="group"><button data-a="lu:bat" aria-pressed="${sub === 'bat'}">타순·수비</button><button data-a="lu:pit" aria-pressed="${sub === 'pit'}">투수진</button><button data-a="lu:str" aria-pressed="${sub === 'str'}">작전</button></div>`;
  if (sub === 'bat') {
    const byPos = {}; for (const o of L.order) byPos[o.pos] = o;
    const hint = !sel ? '포지션 두 개를 차례로 누르면 자리를 맞바꿉니다. 벤치 선수를 고른 뒤 포지션을 누르면 교체됩니다.' : sel.k === 'pos' ? `${V.POSS[sel.pos]} 선택됨 · 바꿀 포지션을 누르세요` : `${sel.name} 선택됨 · 들어갈 포지션을 누르세요`;
    h += `<div class="fieldboard"><svg viewBox="0 0 100 82" preserveAspectRatio="none" aria-hidden="true"><path d="M50 74 L6 30 A62 62 0 0 1 94 30 Z" fill="#1C2D27" stroke="#2B3D49" stroke-width=".4"/><path d="M50 74 L68 56 L50 38 L32 56 Z" fill="#22323D" stroke="#3A4C58" stroke-width=".4"/><circle cx="50" cy="57" r="2" fill="none" stroke="#3A4C58" stroke-width=".4"/></svg>
      ${V.POS9.map(pos => { const o = byPos[pos]; const [x, y] = FIELD_XY[pos]; const on = sel && sel.k === 'pos' && sel.pos === pos; return `<button class="fb-p" style="left:${x}%;top:${y}%" data-a="fpos:${pos}" aria-pressed="${on}" aria-label="${V.POSK[pos]} ${o ? esc(o.name) : ''}"><span class="c">${o ? esc(o.name) : '-'}</span><span class="k">${V.POSS[pos]}${o && o.cond.k === 'inj' ? ' · 부상' : ''}</span></button>`; }).join('')}</div>
      <div class="note" role="status">${esc(hint)}${sel ? ` <button class="link" data-a="sel:">선택 취소</button>` : ''}</div>
      <div class="sec-t">타순</div><div class="card tight ord">${L.order.map((o, i) => `<div class="li"><span class="num">${i + 1}</span><button class="grow" data-a="player:${o.id}" style="border:0;background:transparent;text-align:left;padding:0;min-width:0"><span class="nm" style="display:block">${esc(o.name)} <span class="mut" style="font-size:12px;font-weight:400">${o.posK} · ${o.bats}타</span></span><span class="sub" style="display:block">${o.line ? `${V.f3(o.line.AVG)} · ${o.line.HR}홈런 · OPS ${V.f3(o.line.OPS)}` : '올해 기록 없음'}</span></button>${condChip(o.cond)}${ovrBox(o.ovr)}<span class="ctl"><button class="ic" data-a="ord:${i}:-1" ${i === 0 ? 'disabled' : ''} aria-label="${i + 1}번 위로">${I.up}</button><button class="ic" data-a="ord:${i}:1" ${i === 8 ? 'disabled' : ''} aria-label="${i + 1}번 아래로">${I.down}</button></span></div>`).join('')}</div>
      <button class="btn sm ghost" data-a="autoorder">감독 성향대로 타순 추천</button>
      <div class="sec-t">벤치</div><div class="card tight">${L.bench.length ? L.bench.map(b => `<div class="li"><span class="num">${b.num || ''}</span><button class="grow" data-a="player:${b.id}" style="border:0;background:transparent;text-align:left;padding:0;min-width:0"><span class="nm" style="display:block">${esc(b.name)} <span class="mut" style="font-size:12px;font-weight:400">${V.POSS[b.pos] || b.pos}${b.alt && b.alt.length ? ' / ' + b.alt.map(a => V.POSS[a] || a).join('·') : ''}</span></span><span class="sub" style="display:block">${b.line ? `${V.f3(b.line.AVG)} · ${b.line.PA}타석` : '올해 기록 없음'}</span></button>${condChip(b.cond)}${ovrBox(b.ovr)}<button class="btn xs ${sel && sel.k === 'bench' && sel.id === b.id ? 'gold' : ''}" data-a="bsel:${b.id}">투입</button></div>`).join('') : '<div class="empty">벤치 선수가 없습니다</div>'}</div>`;
    if (L.foreign.length) h += `<div class="sec-t">외국인 선수</div><div class="card tight">${L.foreign.map(f => `<button class="li" data-a="player:${f.id}"><span class="grow"><span class="nm" style="display:block">${esc(f.name)} <span class="mut" style="font-size:12px;font-weight:400">${esc(f.nat || '')} · ${esc(f.pos)}</span></span><span class="sub" style="display:block">${esc(f.line)} · 연봉 ${f.sal}억</span></span>${I.chev}</button>`).join('')}</div>`;
  } else if (sub === 'pit') {
    h += `<div class="sec-t">선발 로테이션</div><div class="card tight">${L.rot.map(r => `<button class="li" data-a="player:${r.id}"><span class="num">${r.n}</span><span class="grow"><span class="nm" style="display:block">${esc(r.name)} <span class="mut" style="font-size:12px;font-weight:400">${r.hand}투</span>${r.next ? ' <span class="chip acc">다음 선발</span>' : ''}</span><span class="sub" style="display:block">${r.line ? `${r.line.W}승 ${r.line.L}패 · ERA ${V.f2(r.line.ERA)} · ${r.line.ipTxt}이닝` : '올해 기록 없음'}</span></span>${condChip(r.cond)}${ovrBox(r.ovr)}</button>`).join('')}</div>
    <div class="sec-t">불펜</div><div class="card tight">${L.pen.map(r => `<button class="li" data-a="player:${r.id}"><span class="chip" style="width:46px;justify-content:center">${r.role}</span><span class="grow"><span class="nm" style="display:block">${esc(r.name)} <span class="mut" style="font-size:12px;font-weight:400">${r.hand}투</span></span><span class="sub" style="display:block">${r.line ? `ERA ${V.f2(r.line.ERA)} · ${r.line.SV}세이브 ${r.line.HLD || 0}홀드 · ${r.line.ipTxt}이닝` : '올해 기록 없음'}</span></span>${condChip(r.cond)}${ovrBox(r.ovr)}</button>`).join('')}</div>
    <div class="note">로테이션과 불펜 보직은 투수 능력 순으로 코치진이 정합니다. 경기 중 교체 타이밍은 작전 탭에서 조정합니다.</div>`;
  } else {
    const s = L.strat, near = (v, opts) => opts.reduce((a, o) => Math.abs(o[0] - v) < Math.abs(a[0] - v) ? o : a)[0];
    const SL = [['steal', '도루', [[0, '자제'], [1, '보통'], [2, '적극']], '주자가 있을 때 얼마나 자주 뛰는지'], ['bunt', '번트', [[-1.5, '거의 안 함'], [0, '상황 따라'], [1.5, '자주']], '희생번트를 대는 기준'], ['hook', '투수 교체', [['quick', '빠르게'], ['normal', '보통'], ['long', '길게']], '선발을 언제 내리는지']];
    h += `<div class="card"><div class="hd"><h3>감독 성향</h3><span class="s">${esc(L.styleName)}</span></div><div class="note">성향은 기본값이고, 아래 작전은 이 시즌 동안 유지됩니다. 경기 엔진의 판단(기대 득점·승리 확률)에 그대로 더해집니다.</div></div>`;
    for (const [k, lab, opts, d] of SL) { const cur = k === 'hook' ? s[k] : near(s[k], opts); h += `<div class="card"><div class="hd"><h3>${lab}</h3><span class="s">${d}</span></div><div class="seg" role="group" aria-label="${lab}">${opts.map(o => `<button data-a="strat:${k}:${o[0]}" aria-pressed="${cur === o[0]}">${o[1]}</button>`).join('')}</div></div>`; }
  }
  return h + `</main>`;
}

// ---------- 선수 ----------
function vPlayer() {
  const P = V.player(G, st.player);
  if (!P) return `${topbar('선수', '', { back: 'closeplayer' })}<main class="pg"><div class="empty">선수를 찾을 수 없습니다</div></main>`;
  const rt = P.ratings.map(([k, v]) => `<div class="rt"><span class="mut">${k}</span><span class="gauge"><i style="width:${(v - 20) / 60 * 100}%;background:${v >= 65 ? 'var(--gold)' : 'var(--acc)'}"></i></span><b>${v}</b></div>`).join('');
  let line = '';
  if (P.isP && P.pl) line = `<div class="grid3"><div class="kv"><span>ERA</span><b>${V.f2(P.pl.ERA)}</b></div><div class="kv"><span>승-패</span><b>${P.pl.W}-${P.pl.L}</b></div><div class="kv"><span>이닝</span><b>${P.pl.ipTxt}</b></div><div class="kv"><span>WHIP</span><b>${V.f2(P.pl.WHIP)}</b></div><div class="kv"><span>탈삼진</span><b>${P.pl.SO}</b></div><div class="kv"><span>세이브·홀드</span><b>${P.pl.SV}·${P.pl.HLD || 0}</b></div></div>`;
  if (!P.isP && P.bl) line = `<div class="grid3"><div class="kv"><span>타율</span><b>${V.f3(P.bl.AVG)}</b></div><div class="kv"><span>출루율</span><b>${V.f3(P.bl.OBP)}</b></div><div class="kv"><span>장타율</span><b>${V.f3(P.bl.SLG)}</b></div><div class="kv"><span>홈런</span><b>${P.bl.HR}</b></div><div class="kv"><span>타점</span><b>${P.bl.RBI}</b></div><div class="kv"><span>도루</span><b>${P.bl.SB}</b></div></div>`;
  let sab = '';
  if (P.saber) { const s = P.saber; const items = P.isP ? [['FIP', s.FIP], ['K/9', s.K9], ['BB/9', s.BB9], ['WAR', s.WAR]] : [['wOBA', s.wOBA], ['wRC+', s.wRC], ['WAR', s.WAR], ['ISO', s.ISO], ['BABIP', s.BABIP], ['K%', s.K], ['BB%', s.BB], ['평균 타구속도', s.EV === '-' ? '-' : s.EV + 'km']]; sab = `<section class="card"><div class="hd"><h3>세이버 지표</h3><span class="s">리그 평균 wRC+ 100</span></div><div class="grid3" style="grid-template-columns:repeat(4,minmax(0,1fr))">${items.map(([k, v]) => `<div class="kv"><span>${k}</span><b style="font-size:14px">${v}</b></div>`).join('')}</div></section>`;
    if (s.splits && s.splits.length) sab += `<section class="card tight"><div class="hd" style="padding:8px 16px 0"><h3>상황별</h3></div><table class="t"><thead><tr><th class="l">상황</th><th>타수</th><th>타율</th><th>OPS</th><th>홈런</th></tr></thead><tbody>${s.splits.map(x => `<tr><td class="l">${x.k}</td><td>${x.ab}</td><td>${x.avg}</td><td>${x.ops}</td><td>${x.hr}</td></tr>`).join('')}</tbody></table></section>`; }
  const log = P.log.length ? `<section class="card tight"><div class="hd" style="padding:8px 16px 0"><h3>최근 경기</h3></div>${P.log.map(g => `<div class="li" style="min-height:44px"><span class="m mut" style="width:38px;font-size:12px">${g.date}</span><span class="grow"><span class="nm" style="display:block;font-size:13px">${esc(g.opp)}</span></span><span class="m" style="font-size:12px">${esc(g.line)}</span>${resPill(g.res === '승' ? 'W' : g.res === '패' ? 'L' : 'T')}</div>`).join('')}</section>` : '';
  const hist = P.history.length ? `<section class="card tight"><div class="hd" style="padding:8px 16px 0"><h3>지난 시즌</h3></div><table class="t"><thead><tr><th class="l">연도</th><th class="l">구단</th><th>출장</th><th>WAR</th></tr></thead><tbody>${P.history.map(x => `<tr><td class="l">${x.y}</td><td class="l">${esc(x.team)}</td><td>${x.pa}</td><td>${x.war}</td></tr>`).join('')}</tbody></table></section>` : '';
  return `${topbar(P.name, `${P.team} · ${P.pos}${P.num ? ' · ' + P.num + '번' : ''}`, { back: 'closeplayer' })}<main class="pg">
  <section class="card"><div class="row" style="gap:14px"><div class="ovr ${P.ovr >= 65 ? 'hi' : ''}" style="width:56px;height:56px;font-size:22px;border-radius:14px">${P.ovr}</div><div class="grow"><div style="font-size:18px;font-weight:600">${esc(P.name)} ${P.en ? `<span class="mut" style="font-size:12px;font-weight:400">${esc(P.en)}</span>` : ''}</div><div class="note">${P.age}세 · ${esc(P.hand)}${P.nat && P.nat !== '대한민국' ? ' · ' + esc(P.nat) : ''} · 잠재력 ${P.pot != null ? P.pot : '-'}</div><div class="note">연봉 ${P.sal}억 · 계약 ${P.yrs}년 남음 · 사기 ${P.morale}</div></div></div>
  ${P.est ? '<div class="note" style="margin-top:10px">다른 구단 선수의 능력치는 우리 스카우트 추정치입니다(오차 있음).</div>' : ''}${P.injured ? `<div class="chip neg" style="margin-top:10px">${esc(P.cond.txt)} · ${esc(P.cond.part || '')}</div>` : ''}</section>
  ${line ? `<section class="card"><div class="hd"><h3>올 시즌</h3><span class="s">${P.isP ? (P.pl ? P.pl.G + '경기' : '') : (P.bl ? P.bl.PA + '타석' : '')}</span></div>${line}</section>` : `<div class="card note">올 시즌 1군 기록이 없습니다.</div>`}
  ${sab}${log}
  <section class="card"><div class="hd"><h3>능력치</h3><span class="s">20–80</span></div>${P.isP ? `<div class="note" style="margin-bottom:8px">${esc(P.pitches)}${P.velo ? ` · 평균 구속 ${P.velo}km` : ''}</div>` : ''}<div class="ratings">${rt}</div></section>
  ${hist}</main>`;
}

// ---------- 이적시장 ----------
function vMarket() {
  const M = V.market(G);
  if (st.trade) return vTrade();
  let h = `${topbar('이적시장', M.open ? (M.phase === 'winter' ? '겨울 트레이드 기간' : `트레이드 마감 ${M.deadline}`) : '트레이드 마감됨')}<main class="pg">`;
  h += `<section class="card"><div class="grid3"><div class="kv"><span>트레이드</span><b style="font-family:var(--kr);font-size:14px" class="${M.open ? 'pos' : 'neg'}">${M.open ? '가능' : '마감'}</b></div><div class="kv"><span>${M.dLeft != null && M.open && M.phase !== 'winter' ? '마감까지' : '마감일'}</span><b>${M.dLeft != null && M.open && M.phase !== 'winter' ? 'D-' + Math.max(0, M.dLeft) : M.deadline.replace(/ \(.\)/, '')}</b></div><div class="kv"><span>페이롤 / 예산</span><b>${M.payroll}<span class="mut" style="font-size:12px"> / ${M.budget}억</span></b></div></div>${!M.open ? '<div class="note" style="margin-top:8px">시즌이 끝나면 트레이드 창이 다시 열립니다.</div>' : ''}</section>`;
  h += `<div class="sec-t">받은 제안</div>`;
  if (!M.props.length) h += `<div class="card empty">지금 들어온 제안이 없습니다. AI 구단은 마감 직전과 겨울에 제안을 보냅니다.</div>`;
  for (const p of M.props) h += `<section class="card"><div class="hd"><h3>${esc(p.from)}</h3><span class="s">${esc(p.why)}</span></div>
    <div class="grid2"><div><div class="note" style="margin-bottom:4px">우리가 줌</div>${p.gives.map(x => `<button class="tag" data-a="player:${x.id}" style="border:0;color:inherit;width:100%;margin-bottom:4px">${ovrBox(x.ovr)}<span style="text-align:left">${esc(x.name)}<br><span class="mut">${x.pos} · ${x.age}세 · ${x.sal}억</span></span></button>`).join('')}</div>
    <div><div class="note" style="margin-bottom:4px">우리가 받음</div>${p.gets.map(x => `<button class="tag" data-a="player:${x.id}" style="border:0;color:inherit;width:100%;margin-bottom:4px">${ovrBox(x.ovr)}<span style="text-align:left">${esc(x.name)}<br><span class="mut">${x.pos} · ${x.age}세 · ${x.sal}억</span></span></button>`).join('')}</div></div>
    <div class="note" style="margin:6px 0 10px">받는 선수 능력치는 스카우트 추정치입니다.</div>
    <div class="btns"><button class="btn sm ghost" data-a="prop:${p.idx}:0">거절</button><button class="btn sm pri" data-a="prop:${p.idx}:1">수락</button></div></section>`;
  h += `<div class="sec-t">직접 제안</div>`;
  h += M.open ? `<div class="card tight">${M.teams.map(t => `<button class="li" data-a="trade:${t.id}"><span class="grow"><span class="nm" style="display:block">${esc(t.name)}</span><span class="sub" style="display:block">${esc(t.strat)}</span></span>${I.chev}</button>`).join('')}</div>` : `<div class="card empty">트레이드 창이 닫혀 있습니다</div>`;
  if (M.hist.length) h += `<div class="sec-t">최근 거래</div><div class="card tight">${M.hist.map(x => `<div class="li"><span class="grow"><span class="nm" style="display:block;font-size:13px">${esc(x.txt)}</span><span class="sub" style="display:block">${yr(x.y)} · ${esc(x.other)}</span></span></div>`).join('')}</div>`;
  if (M.fa.length) h += `<div class="sec-t">이번 겨울 FA 영입(프런트)</div><div class="card tight">${M.fa.map(x => `<div class="li"><span class="grow nm">${esc(x.name)}</span><span class="m" style="font-size:12px">${x.yrs}년 ${x.sal}억</span></div>`).join('')}</div>`;
  return h + `</main>`;
}
function vTrade() {
  const T = st.trade, D = V.tradeTeam(G, T.team), ev = T.gives.length && T.gets.length ? V.evalTrade(G, T.team, T.gives, T.gets) : null;
  const pick = (arr, ids) => arr.filter(p => ids.includes(p.id));
  const side = T.side || 'theirs', list = (side === 'theirs' ? D.theirs : D.ours).filter(p => !(side === 'theirs' ? T.gets : T.gives).includes(p.id));
  const tagList = (arr, kind) => arr.length ? arr.map(p => `<span class="tag">${ovrBox(p.ovr)}<span class="grow">${esc(p.name)} <span class="mut">${p.pos} · ${p.sal}억</span></span><button data-a="trm:${kind}:${p.id}" aria-label="${esc(p.name)} 빼기">✕</button></span>`).join('') : `<div class="note">아래에서 선수를 고르세요</div>`;
  let h = `${topbar(`${D.team.short}와 트레이드`, '최대 2:2', { back: 'closetrade' })}<main class="pg">
  <section class="card"><div class="grid2"><div><div class="note" style="margin-bottom:6px">받을 선수</div><div class="tradebox">${tagList(pick(D.theirs, T.gets), 'get')}</div></div><div><div class="note" style="margin-bottom:6px">줄 선수</div><div class="tradebox">${tagList(pick(D.ours, T.gives), 'give')}</div></div></div>
  ${ev ? `<div class="divider"></div><div class="grid2"><div class="kv"><span>우리 쪽 가치 변화</span><b class="${+ev.usV >= 0 ? 'pos' : 'neg'}">${+ev.usV >= 0 ? '+' : ''}${ev.usV}억</b></div><div class="kv"><span>거래 후 페이롤</span><b>${ev.pay}<span class="mut" style="font-size:12px"> / ${ev.budget}억</span></b></div></div><div class="note" style="margin-top:6px">가치는 남은 계약 기간의 기대 WAR에서 연봉을 뺀 값(우리 구단 기준)입니다.</div>` : ''}
  <button class="btn pri block" style="margin-top:12px" data-a="propose" ${ev ? '' : 'disabled'}>제안하기</button></section>

const board = name => BOARDS[name] || (BOARDS[name] = new Board(BOARD_SRC[name]));
// 지금 화면에 맞는 보드와 데이터
function boardView() {
  if (!G || ['title', 'how', 'new', 'end'].includes(st.scr) || st.game || st.view === 'yearbook') return null;
  if (st.player) { const D = SC.player(G, st.player); return D ? { name: 'Player', D, key: 'p:' + st.player } : null; }
  if (st.scr === 'live') return { name: 'Game', D: SC.liveGame(G, st.live, lnm), key: 'live' };
  if (st.scr === 'decision') {
    const t = G.cur.t;
    if (t === 'seasonEnd') { const D = SC.seasonEnd(G); if (!D) return null; return { name: 'SeasonEnd', D: { ...D, backHref: '#none', nextHref: '#next', nextTxt: '다음 · 감독 거취와 오프시즌' }, key: 'se' }; }
    if (t === 'fa') return { name: 'FA', D: SC.fa(G), key: 'fad' };
    if (t === 'foreign') { if (!st.dec.keep) { st.dec.keep = G.cur.current.map(c => c.id); st.dec.sign = []; } return { name: 'Foreign', D: SC.foreign(G, st.dec), key: 'fd' }; }
    return null;
  }
  if (st.view === 'seasonend') { const D = SC.seasonEnd(G); if (D) return { name: 'SeasonEnd', D: { ...D, backHref: '#closeview', nextHref: '#closeview', nextTxt: '닫기' }, key: 'se2' }; }
  if (st.view === 'fa') return { name: 'FA', D: SC.fa(G), key: 'fa' };
  if (st.view === 'foreign') return { name: 'Foreign', D: SC.foreign(G, null), key: 'fv' };
  if (st.trade && st.tab === 'market') return { name: 'Trade', D: SC.trade(G, st.trade), key: 'tr' };
  if (st.tab === 'home') return { name: 'Dugout', D: SC.dugout(G), key: 'dg' };
  if (st.tab === 'lineup') return { name: 'Lineup', D: SC.lineup(G), key: 'lu' };
  if (st.tab === 'market') return { name: 'Market', D: SC.market(G, { all: st.marketAll }), key: 'mk' };
  if (st.tab === 'career') return { name: 'Career', D: SC.career(G), key: 'cr' };
  return null;
}
function sheetHTML() {
  const sh = st.sheet; if (!sh) return '';
  let body = '';
  if (sh.k === 'sim') {
    const cal = G.world.cal, day = G.cur && G.cur.day, dl = cal && cal.tradeOpen && day != null && day < cal.deadline;
    body = `<div class="hd"><h3>빠르게 진행</h3><span class="s">경기는 코치 판단으로 치릅니다</span></div>
      <button class="li" data-a="run:game"><span class="grow"><span class="nm" style="display:block">이 경기 결과만</span><span class="sub" style="display:block">중계 기록은 덕아웃에서 다시 볼 수 있습니다</span></span>${I.chev}</button>
      <button class="li" data-a="run:week"><span class="grow"><span class="nm" style="display:block">1주 넘기기</span></span>${I.chev}</button>
      ${dl ? `<button class="li" data-a="run:deadline"><span class="grow"><span class="nm" style="display:block">트레이드 마감일까지</span><span class="sub" style="display:block">AI 구단 제안이 마감 직전에 몰립니다</span></span>${I.chev}</button>` : ''}
      <button class="li" data-a="run:end"><span class="grow"><span class="nm" style="display:block">시즌 끝까지</span><span class="sub" style="display:block">결정할 일이 생기면 멈춥니다</span></span>${I.chev}</button>`;
  } else if (sh.k === 'teams') {
    const S = SC.snap(G);
    body = `<div class="hd"><h3>트레이드 상대</h3><span class="s">구단을 고르세요</span></div>` + G.world.teams.filter(t => t !== G.U).map(t => { const r = S.standings.find(x => x.id === t.id); return `<button class="li" data-a="tteam:${t.id}"><span class="grow"><span class="nm" style="display:block">${esc(t.name)}</span><span class="sub" style="display:block">${S.started ? r.rank + '위 · ' : ''}${{ contend: '윈나우', balanced: '균형', rebuild: '리빌딩', budget: '긴축' }[t.strategy] || ''}</span></span>${I.chev}</button>`; }).join('');
  } else if (sh.k === 'tpick') {
    const T = st.trade, D = V.tradeTeam(G, T.team), mine = sh.side === 'ours', list = (mine ? D.ours : D.theirs).filter(p => !(mine ? T.gives : T.gets).includes(p.id));
    body = `<div class="hd"><h3>${mine ? '보낼 우리 선수' : esc(D.team.short) + ' 선수'}</h3><span class="s">${mine ? 'OVR 순' : '우리 스카우트 추정 OVR 순'}</span></div>` + list.slice(0, 50).map(p => `<div class="li"><button class="grow" data-a="player:${p.id}" style="border:0;background:transparent;text-align:left;padding:0;min-width:0;color:inherit"><span class="nm" style="display:block">${esc(p.name)} <span class="mut" style="font-size:12px;font-weight:400">${p.pos} · ${p.age}세${p.farm ? ' · 2군' : ''}</span></span><span class="sub" style="display:block">${p.sal}억 · ${p.yrs}년 · ${p.line}</span></button>${ovrBox(p.ovr)}<button class="btn xs" data-a="tadd:${mine ? 'ours' : 'theirs'}:${p.id}">추가</button></div>`).join('');
  } else if (sh.k === 'owner') {
    const D = SC.career(G); body = `<div class="hd"><h3>구단주 면담</h3></div><div style="padding:0 16px" class="note">${esc(D.owner)}<br><br>${esc(D.ownerDetail)}</div>`;
  } else if (sh.k === 'live') return '';
  return `<div class="lv-scrim" data-a="sheet:"></div><div class="lv-sheet" role="dialog">${body}<button class="btn ghost block" data-a="sheet:">닫기</button></div>`;
}
function liveSheetHTML() {
  const L = st.live, c = G.cur; if (!L || !L.sheet || c.t !== 'pa') return '';
  let body = '';
  if (L.sheet === 'pen') {
    body = `<div class="hd"><h3>투수 교체</h3><span class="s">지금 ${esc(lnm(c.def.pit.p.id))} · ${c.def.pit.pitches}구</span></div><button class="li" data-a="lo:keep"><span class="grow"><span class="nm" style="display:block">그대로 간다</span><span class="sub" style="display:block">코치가 교체를 권해도 이번 타석은 바꾸지 않음</span></span></button>` + c.def.pen.map(r => { const pl = V.pitLine(G.book, r.p); const off = r.used; return `<button class="li" data-a="lpick:pitch:${r.p.id}" ${off ? 'disabled' : ''}><span class="chip" style="width:46px;justify-content:center">${{ CL: '마무리', SU: '셋업', MID: '중간', LONG: '롱' }[r.role] || r.role}</span><span class="grow"><span class="nm" style="display:block">${esc(lnm(r.p.id))} <span class="mut" style="font-size:12px;font-weight:400">${V.HAND[r.p.throws]}투</span></span><span class="sub" style="display:block">${off ? '이미 등판' : r.avail ? (pl ? `ERA ${V.f2(pl.ERA)} · ${pl.ipTxt}이닝` : '올해 첫 등판') : '<span class="warn">연투·휴식 부족</span>'}</span></span>${ovrBox(Cr.overall(r.base || r.p))}</button>`; }).join('');
  } else if (L.sheet === 'bench' || L.sheet === 'pr') {
    const off = c.off, cur = off.lineup[off.idx].p, pit = c.def.pit.p, g = c.G;
    if (L.sheet === 'pr') {
      const runners = [0, 1, 2].filter(i => g.bases[i]).map(i => ({ i, p: g.bases[i].p }));
      const base = L.prBase != null ? L.prBase : runners.length ? runners[runners.length - 1].i : null;
      body = `<div class="hd"><h3>대주자</h3><span class="s">바꿀 주자를 고른 뒤 선수를 고르세요</span></div><div class="tabs2" style="padding:0 16px 8px">${runners.map(r => `<button data-a="lprbase:${r.i}" aria-pressed="${base === r.i}">${r.i + 1}루 ${esc(lnm(r.p.id))}</button>`).join('')}</div>` + off.bench.map(x => `<button class="li" data-a="lpick:pr:${base}:${x.p.id}" ${x.used || base == null ? 'disabled' : ''}><span class="grow"><span class="nm" style="display:block">${esc(lnm(x.p.id))} <span class="mut" style="font-size:12px;font-weight:400">${V.POSS[x.p.pos] || x.p.pos}</span></span><span class="sub" style="display:block">${x.used ? '이미 출전' : '스피드 ' + Math.round((x.base || x.p).spd) + ' · 주루 ' + Math.round((x.base || x.p).br)}</span></span>${ovrBox(Cr.overall(x.base || x.p))}</button>`).join('');
    } else body = `<div class="hd"><h3>대타</h3><span class="s">${esc(lnm(cur.id))} 대신 · 상대 ${V.HAND[pit.throws]}투</span></div>` + (off.bench.length ? off.bench.map(x => { const bl = V.batLine(G.book, x.p); return `<button class="li" data-a="lpick:ph:${x.p.id}" ${x.used ? 'disabled' : ''}><span class="grow"><span class="nm" style="display:block">${esc(lnm(x.p.id))} <span class="mut" style="font-size:12px;font-weight:400">${V.POSS[x.p.pos] || x.p.pos} · ${V.HAND[x.p.bats]}타</span></span><span class="sub" style="display:block">${x.used ? '이미 출전' : bl ? `${V.f3(bl.AVG)} · OPS ${V.f3(bl.OPS)} · ${bl.PA}타석` : '올해 기록 없음'}</span></span>${ovrBox(Cr.overall(x.base || x.p))}</button>`; }).join('') : '<div class="empty">벤치 선수가 없습니다</div>');
  } else {
    body = `<div class="hd"><h3>자동 진행</h3><span class="s">코치 판단으로 진행</span></div>
      <button class="li" data-a="live-auto:crisis"><span class="grow"><span class="nm" style="display:block">승부처까지</span><span class="sub" style="display:block">기본 진행 · 승부처나 코치 권유가 있을 때만 멈춤</span></span>${I.chev}</button>
      <button class="li" data-a="live-go"><span class="grow"><span class="nm" style="display:block">한 타석만</span><span class="sub" style="display:block">투구 하나하나 중계로 봅니다</span></span>${I.chev}</button>
      <button class="li" data-a="live-auto:inning"><span class="grow"><span class="nm" style="display:block">이번 이닝 끝까지</span></span>${I.chev}</button>
      <button class="li" data-a="live-auto:end"><span class="grow"><span class="nm" style="display:block">경기 끝까지</span></span>${I.chev}</button>
      <div class="divider"></div><div class="row" style="padding:0 16px 8px"><span class="grow note">중계 속도</span><div class="seg" style="width:180px">${[['0', '즉시'], ['1', '보통'], ['2', '느리게']].map(([k, l]) => `<button data-a="lspeed:${k}" aria-pressed="${String(L.speed) === k}">${l}</button>`).join('')}</div></div>`;
  }
  return `<div class="lv-scrim" data-a="lsheet:"></div><div class="lv-sheet" role="dialog">${body}<button class="btn ghost block" data-a="lsheet:">닫기</button></div>`;
}

// ---------- 렌더 ----------
function render() {
  let html = '', bv = null;
  try {
    bv = boardView();
    if (bv) html = '<div id="bd"></div>';
    else if (st.scr === 'title') html = vTitle();
    else if (st.scr === 'how') html = vHow();
    else if (st.scr === 'new') html = vNew();
    else if (st.scr === 'decision') html = vDecision();
    else if (st.scr === 'end') html = vEnd();
    else if (st.game) html = vGame();
    else if (st.view === 'yearbook') html = vEnd(true);
    else { html = vRecords() + tabbar(); }
  } catch (e) { console.error(e); bv = null; html = `<div class="sheet"><div class="eyebrow">오류</div><h1>화면을 그리지 못했습니다</h1><pre style="white-space:pre-wrap;font-size:11px;color:var(--tx2)">${esc(e && e.stack || e)}</pre><div class="foot"><button class="btn block" data-a="title">타이틀로</button></div></div>`; }
  try { if (G) html += st.scr === 'live' && !st.player ? liveSheetHTML() : sheetHTML(); } catch (e) { console.error(e); }
  if (st.err) { html += `<div class="toast" style="background:var(--neg)">오류: ${esc(st.err.split('\n')[0])}</div>`; st.err = null; }
  if (st.toast) html += `<div class="toast" role="status">${esc(st.toast)}</div>`;
  const key = st.scr + st.tab + !!st.game + (st.player || '') + !!st.trade + (st.view || '');
  const keepScroll = (st.scr === 'live' && !st.player) || render.lastKey === key;
  const y = window.scrollY;
  $app.innerHTML = html;
  if (bv) { try { board(bv.name).render(document.getElementById('bd'), bv.D, bv.key); } catch (e) { console.error(e); document.getElementById('bd').innerHTML = `<div class="sheet"><h1>화면 오류</h1><pre style="white-space:pre-wrap;font-size:11px">${esc(e && e.stack || e)}</pre></div>`; } }
  render.lastKey = key;
  window.scrollTo(0, keepScroll ? y : 0);
  const nm = document.getElementById('ncName'); if (nm) nm.addEventListener('input', e => { st.nc.name = e.target.value; });
}

// ---------- 이벤트 ----------
const A = {
  title() { st.scr = 'title'; st.confirm = null; st.game = st.player = st.trade = null; render(); },
  howto() { st.scr = 'how'; render(); },
  confirm(v) { st.confirm = v || null; render(); },
  newcareer(v) { if (Game.hasSave() && v !== 'force' && !(G && G.world.gameOver)) { st.confirm = 'new'; return render(); } st.confirm = null; openNew(); },
  async continue() { busy(true, '커리어를 불러오는 중'); await frame(); try { G = await Game.load(); if (G) { try { G._star = new Set(JSON.parse(localStorage.getItem('thedugout.star') || '[]')); } catch (e) { } } } catch (e) { console.error(e); G = null; st.err = '저장을 불러오지 못했습니다'; } busy(false); if (!G) { st.scr = 'title'; return render(); } st.scr = 'main'; st.tab = 'home'; track('session_continue', trackCtx()); route(); },
  'nc-prev'() { st.nc.step--; render(); },
  'nc-next'() { st.nc.step++; render(); },
  'nc-club'(i) { st.nc.club = +i; render(); },
  'nc-style'(k) { st.nc.style = k; render(); },
  'nc-go'() { startCareer(); },
  tab(k) { st.tab = k; st.sel = null; st.trade = null; st.confirm = null; st.view = null; st.player = null; st.sheet = null; if (G) G._luSel = null; if (st.scr === 'live' && !G.isLive()) st.scr = 'main'; render(); },
  records() { A.tab('records'); },
  none() { },
  sheet(v) { st.sheet = v ? { k: v } : null; render(); },
  back() { st.player = st.pStack && st.pStack.length ? st.pStack.pop() : null; render(); },
  star(id) { const S = G._star || (G._star = new Set()); if (S.has(id)) S.delete(id); else S.add(id); try { localStorage.setItem('thedugout.star', JSON.stringify([...S])); } catch (e) { } toast(S.has(id) ? '관심 선수에 올렸습니다 · 이적시장 맨 위에 보입니다' : '관심 선수에서 뺐습니다'); },
  extend(id) { const r = G.act('extend', { id }); G.save(); toast(r.ok ? `재계약 · ${r.yrs}년 ${r.sal}억` : r.reason); },
  tradegive(id) { st.pendingGive = id; st.tab = 'market'; st.player = null; st.sheet = { k: 'teams' }; render(); },
  tradeget(a) { const [team, id] = a.split(':'); st.tab = 'market'; st.player = null; st.view = null; st.trade = { team, gives: [], gets: [id] }; st.sheet = null; render(); },
  tradeteams() { st.tab = 'market'; st.sheet = { k: 'teams' }; render(); },
  tteam(id) { const keep = st.trade && st.trade.team === id ? st.trade : null; st.trade = keep || { team: id, gives: st.pendingGive ? [st.pendingGive] : (st.trade ? st.trade.gives : []), gets: [] }; st.pendingGive = null; st.sheet = null; st.view = null; render(); },
  tpick(side) { if (!st.trade) return A.tradeteams(); st.sheet = { k: 'tpick', side }; render(); },
  tradecancel() { st.trade = null; render(); },
  nego() { if (st.trade) { st.view = null; render(); } else A.tradeteams(); },
  watchall() { st.marketAll = !st.marketAll; render(); },
  seasonend() { if (G.world.hist.length && (G.M.history || []).length) { st.view = 'seasonend'; render(); } else toast('첫 시즌이 끝나면 열립니다'); },
  closeview() { st.view = null; render(); },
  owner() { st.sheet = { k: 'owner' }; render(); },
  yearbook() { st.view = 'yearbook'; render(); },
  nogame() { toast('이 경기 중계 기록은 저장돼 있지 않습니다'); },
  foreign() { st.view = 'foreign'; st.player = null; render(); },
  foreignback() { if (st.scr === 'decision') return; st.view = null; render(); },
  fadone() { answer(undefined).then(saveMeta); },
  fa(id) { if (!id) { st.view = 'fa'; st.player = null; return render(); } const r = G.act('fa', { id }); G.save(); track('fa_sign', { ok: !!r.ok, ...trackCtx() }); toast(r.ok ? `FA 계약 · ${r.yrs}년 ${r.sal}억` : r.reason); },
  scout(id) { if (!id) return; G.act('scout', { id, weeks: 2 }); G.save(); toast('스카우트를 2주 보냈습니다 · 추정 범위가 좁아집니다'); },
  lprbase(i) { st.live.prBase = +i; render(); },
  run(m) { st.sheet = null; run(m).then(saveMeta); },
  simmenu() { st.sheet = { k: 'sim' }; render(); },
  lastgame() { const lg = G.games[G.games.length - 1]; if (lg) { st.game = lg; st.sub.gameFilter = 'key'; render(); } },
  game(i) { st.game = G.games[+i]; st.sub.gameFilter = 'key'; render(); },
  closegame() { st.game = null; render(); },
  gf(v) { st.sub.gameFilter = v; render(); },
  player(id) { if (!id || id === 'undefined') return; if (st.player) (st.pStack = st.pStack || []).push(st.player); else st.pStack = []; G._pBack = st.player ? '이전 선수' : st.scr === 'live' ? '경기' : st.view === 'fa' ? 'FA 시장' : st.view === 'foreign' || (st.scr === 'decision' && G.cur.t === 'foreign') ? '외국인 시장' : st.trade ? '트레이드' : ({ home: '덕아웃', lineup: '라인업', market: '이적시장', records: '기록실', career: '커리어' })[st.tab] || '뒤로'; st.player = id; st.sheet = null; render(); },
  closeplayer() { st.player = null; render(); },
  lu(v) { st.sub.lu = v; st.sel = null; render(); },
  sel() { st.sel = null; render(); },
  fpos(pos) {
    const { L, plan, order } = curPlan(), sel = st.sel;
    if (!sel) { st.sel = { k: 'pos', pos }; return render(); }
    if (sel.k === 'pos') { if (sel.pos !== pos) { const a = plan[sel.pos], b = plan[pos]; plan[sel.pos] = b; plan[pos] = a; setLineup(plan, order); toast(`${V.POSS[sel.pos]} ↔ ${V.POSS[pos]} 자리를 바꿨습니다`); } st.sel = null; return render(); }
    if (sel.k === 'bench') { const out = plan[pos]; plan[pos] = sel.id; const i = order.indexOf(out); if (i >= 0) order[i] = sel.id; setLineup(plan, order); const o = L.order.find(x => x.id === out); st.sel = null; toast(`${sel.name} 투입 · ${o ? o.name : ''} 벤치로`); }
  },
  bsel(id) { const L = V.lineup(G), b = L.bench.find(x => x.id === id); st.sel = st.sel && st.sel.id === id ? null : { k: 'bench', id, name: b ? b.name : '' }; render(); window.scrollTo(0, 0); },
  ord(a) { const [i, d] = a.split(':').map(Number); const { plan, order } = curPlan(); const j = i + d; if (j < 0 || j > 8) return; [order[i], order[j]] = [order[j], order[i]]; setLineup(plan, order); render(); },
  autoorder() { const { plan } = curPlan(); G.act('lineup', { plan }); G.save(); toast('성향에 맞춰 타순을 다시 짰습니다'); },
  strat(a) { const [k, v] = a.split(':'); G.act('strategy', { [k]: k === 'hook' ? v : +v }); G.save(); render(); },
  prop(a) { const [i, ok] = a.split(':').map(Number); const r = G.act('proposal', { idx: i, accept: !!ok }); G.save(); toast(r.ok ? (ok ? '트레이드가 성사됐습니다' : '제안을 거절했습니다') : r.reason); },
  trade(id) { st.trade = { team: id, gives: [], gets: [], side: 'theirs' }; render(); },
  closetrade() { st.trade = null; render(); },
  tside(s) { st.trade.side = s; render(); },
  tadd(a) { const [s, id] = a.split(':'); const arr = s === 'theirs' ? st.trade.gets : st.trade.gives; if (arr.length < 2 && !arr.includes(id)) arr.push(id); st.sheet = null; st.player = null; render(); },
  trm(a) { const [k, id] = a.split(':'); const arr = k === 'get' ? st.trade.gets : st.trade.gives; arr.splice(arr.indexOf(id), 1); render(); },
  propose() { const T = st.trade; const r = G.act('trade', { team: T.team, gives: T.gives, gets: T.gets }); G.save(); track('trade_propose', { ok: !!r.ok, ...trackCtx() }); if (r.ok) { st.trade = null; toast('상대가 수락했습니다. 트레이드 성사'); } else toast(`거절: ${r.reason || '조건이 맞지 않습니다'}`); },
